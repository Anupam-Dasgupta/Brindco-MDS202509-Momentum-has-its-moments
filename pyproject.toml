[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brindco-momentum"
version = "0.1.0"
description = "Reproducible NIFTY 500 momentum research"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.3.5",
    "pandas==3.0.1",
    "pyarrow==25.0.1",
    "requests==2.32.5",
    "pdfplumber==0.11.8",
    "pypdf==6.10.0",
    "pillow==12.3.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
